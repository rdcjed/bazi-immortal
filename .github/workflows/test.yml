name: Full Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: pytest
        run: python -m pytest -q
      - name: test_cases
        run: python tests/test_cases.py
      - name: run_celebrities
        run: python tests/run_celebrities.py